name: frontend-ci

# 仓库后端在根目录、前端在 frontend/ 子目录，本工作流所有步骤均在 frontend 下执行。
# GitHub Actions 只识别仓库根 .github/workflows/，故文件放在此处。
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + Lint + 单测 + 构建
        run: npm run ci
